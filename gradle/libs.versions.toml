[versions]
agp = "8.7.3"
kotlin = "2.0.21"
ksp = "2.0.21-1.0.28"
androidxCore = "1.15.0"
appcompat = "1.7.0"
material = "1.12.0"
constraintlayout = "2.2.0"
recyclerview = "1.3.2"
lifecycle = "2.8.7"
activity = "1.10.0"
fragment = "1.8.5"
navigation = "2.8.5"
room = "2.7.0"
work = "2.10.0"
coroutines = "1.9.0"
firebaseBom = "33.7.0"
mpandroidchart = "3.1.0"
junit = "4.13.2"
robolectric = "4.14.1"
androidxTestCore = "1.6.1"
androidxTestRunner = "1.6.2"
androidxTestRules = "1.6.1"
